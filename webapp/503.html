<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Технические работы — Мои AI Новости</title>
    <style>

        * { margin:0; padding:0; box-sizing:border-box; }
        :root {
            --bg-color: #010715;
            --footer-bg: #111c40;
            --text: #fff;
            --text-secondary: #8a9bb5;
            --accent: #6c5ce7;
            --accent2: #3088ff;
            --border: rgba(255,255,255,0.06);
            --radius: 24px;
            --shadow: 0 12px 48px rgba(0,0,0,0.6);
        }
        html { scroll-behavior: smooth; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, "Fira Sans", "Droid Sans", "Helvetica Neue", Arial, sans-serif;
            background: var(--footer-bg) linear-gradient(180deg, #020e33 0%, var(--bg-color) 25%, var(--bg-color) 84%, var(--footer-bg) 100%);
            color: var(--text);
            line-height: 1.6;
            padding: 20px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        .container {
            max-width: 560px;
            width: 100%;
            background: rgba(255,255,255,0.04);
            border-radius: var(--radius);
            padding: 50px 30px 40px;
            border: 1px solid var(--border);
            backdrop-filter: blur(4px);
            box-shadow: var(--shadow);
        }

        .logo {
            font-size: 32px;
            font-weight: 700;
            background: linear-gradient(290deg, #d235ff 0%, #a062ff 30%, #3088ff 66%, #61d8ff 100%);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            margin-bottom: 8px;
            letter-spacing: -0.5px;
        }
        .logo span { font-weight: 300; color: var(--text-secondary); background: none; -webkit-background-clip: unset; background-clip: unset; }

        .title {
            font-size: 28px;
            font-weight: 700;
            margin: 16px 0 8px;
            display: inline-block;
            background: linear-gradient(290deg, #d235ff 0%, #a062ff 30%, #3088ff 66%, #61d8ff 100%);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .subtitle {
            color: var(--text-secondary);
            font-size: 18px;
            margin-bottom: 24px;
            line-height: 1.5;
        }

        /* ===== КРАСИВЫЙ КРУГЛЫЙ ИНДИКАТОР ===== */
        .loader-wrapper {
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 10px 0 24px 0;
        }
        .loader-circle {
            position: relative;
            width: 80px;
            height: 80px;
        }
        .loader-circle svg {
            transform: rotate(-90deg);
            width: 80px;
            height: 80px;
        }
        .loader-circle .bg {
            fill: none;
            stroke: rgba(255,255,255,0.06);
            stroke-width: 6;
        }
        .loader-circle .progress {
            fill: none;
            stroke-width: 6;
            stroke-linecap: round;
            stroke-dasharray: 226;
            stroke-dashoffset: 226;
            animation: spin-progress 2s ease-in-out infinite;
            stroke: url(#gradient);
        }
        @keyframes spin-progress {
            0% { stroke-dashoffset: 226; }
            50% { stroke-dashoffset: 40; }
            100% { stroke-dashoffset: 226; }
        }
        .loader-circle .icon {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 32px;
            opacity: 0.7;
            animation: pulse-icon 2s ease-in-out infinite;
        }
        @keyframes pulse-icon {
            0%, 100% { transform: translate(-50%, -50%) scale(1); opacity: 0.7; }
            50% { transform: translate(-50%, -50%) scale(1.1); opacity: 1; }
        }

        .btn-retry {
            display: inline-block;
            margin-top: 8px;
            padding: 14px 40px;
            font-size: 17px;
            font-weight: 700;
            border-radius: 40px;
            text-decoration: none;
            color: #fff;
            border: 1px solid transparent;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            background: linear-gradient(180deg, rgba(159,103,255,.22), rgba(197,66,255,.35)) padding-box,
                        linear-gradient(var(--bg-color), var(--bg-color)) padding-box,
                        linear-gradient(180deg, rgba(171,78,252,.82) 0%, rgba(108,31,198,.24) 53%, #7C45C2 100%) border-box,
                        linear-gradient(180deg, rgba(159,103,255,.22), rgba(197,66,255,.35)) border-box;
        }
        .btn-retry:hover {
            transform: scale(1.04);
            box-shadow: 0 0 30px rgba(48,136,255,0.3);
        }
        .btn-retry:active { transform: scale(0.96); }

        .footer {
            margin-top: 40px;
            color: var(--text-secondary);
            font-size: 13px;
            opacity: 0.6;
        }

        @media (max-width: 640px) {
            .container { padding: 40px 20px 30px; }
            .logo { font-size: 26px; }
            .title { font-size: 24px; }
            .subtitle { font-size: 16px; }
            .loader-circle { width: 64px; height: 64px; }
            .loader-circle svg { width: 64px; height: 64px; }
            .loader-circle .icon { font-size: 26px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">Мои <span>AI Новости</span></div>
        <div class="title">Технические работы</div>
        <div class="subtitle">Пожалуйста, подождите несколько секунд. Сервер обновляется. </div>

        <!-- КРАСИВЫЙ КРУГЛЫЙ ИНДИКАТОР ПО ЦЕНТРУ -->
        <div class="loader-wrapper">
            <div class="loader-circle">
                <svg viewBox="0 0 80 80">
                    <defs>
                        <linearGradient id="gradient" x1="0%" y1="0%" x2="100%" y2="100%">
                            <stop offset="0%" style="stop-color:#d235ff" />
                            <stop offset="50%" style="stop-color:#a062ff" />
                            <stop offset="100%" style="stop-color:#3088ff" />
                        </linearGradient>
                    </defs>
                    <circle class="bg" cx="40" cy="40" r="36" />
                    <circle class="progress" cx="40" cy="40" r="36" />
                </svg>
                <span class="icon">⚙️</span>
            </div>
        </div>

        <button class="btn-retry" onclick="location.reload()">Обновить сейчас</button>
    </div>
    <div class="footer">© 2026 Мои AI Новости</div>

    <script>
        // Автоматическое обновление через 5 секунд
        setTimeout(() => {
            location.reload();
        }, 5000);
    </script>
</body>
</html>
