    <!-- ===== СТИЛИ (ВСЕ ВАШИ, БЕЗ ИЗМЕНЕНИЙ) ===== -->
</head>
<style>
        * { margin:0; padding:0; box-sizing:border-box; }
        :root {
            --bg-color: #010715;
            --footer-bg: #111c40;
            --text: #fff;
            --text-secondary: #8a9bb5;
            --accent2: #3088ff;
            --card-bg: rgba(255,255,255,0.04);
            --border: rgba(255,255,255,0.06);
            --radius: 20px;
            --shadow: 0 12px 48px rgba(0,0,0,0.6);
        }
        html, body {
            overflow-x: hidden;
            max-width: 100%;
            min-height: 100vh;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, "Fira Sans", "Droid Sans", "Helvetica Neue", Arial, sans-serif;
            background: var(--footer-bg) linear-gradient(180deg, #020e33 0%, var(--bg-color) 25%, var(--bg-color) 84%, var(--footer-bg) 100%);
            color: var(--text);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            min-height: 100vh;
            text-align: center;
        }
        .container {
            max-width: 500px;
            width: 100%;
            background: var(--card-bg);
            border-radius: var(--radius);
            padding: 40px 30px;
            border: 1px solid var(--border);
            backdrop-filter: blur(4px);
            box-shadow: var(--shadow);
            margin: 20px 0;
        }
        .logo {
            font-size: 28px;
            font-weight: 700;
            background: linear-gradient(290deg, #d235ff 0%, #a062ff 30%, #3088ff 66%, #61d8ff 100%);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            letter-spacing: -0.5px;
            margin-bottom: 12px;
        }
        .icon {
            font-size: 56px;
            margin-bottom: 8px;
        }
        h1 {
            font-size: 26px;
            font-weight: 700;
            margin: 8px 0 12px;
            background: linear-gradient(290deg, #d235ff 0%, #a062ff 30%, #3088ff 66%, #61d8ff 100%);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            line-height: 1.3;
        }
        p {
            color: var(--text-secondary);
            font-size: 16px;
            line-height: 1.6;
            margin: 12px 0 20px;
        }
        .btn {
            display: inline-block;
            padding: 12px 32px;
            font-size: 16px;
            font-weight: 700;
            border: none;
            border-radius: 40px;
            background: linear-gradient(290deg, #d235ff 0%, #a062ff 30%, #3088ff 66%, #61d8ff 100%);
            color: #fff;
            cursor: pointer;
            transition: transform 0.2s, opacity 0.2s;
            text-decoration: none;
        }
        .btn:hover {
            transform: scale(1.03);
            opacity: 0.9;
        }
        .btn-secondary {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--text-secondary);
            margin-top: 8px;
        }
        .btn-secondary:hover {
            background: rgba(255,255,255,0.05);
            color: var(--text);
        }
        .footer {
            font-size: 13px;
            color: var(--text-secondary);
            opacity: 0.6;
            margin-top: 20px;
        }
        .footer a {
            color: var(--accent2);
            text-decoration: none;
        }
        .footer a:hover {
            text-decoration: underline;
        }
        @media (max-width: 480px) {
            .container { padding: 30px 20px; }
            .logo { font-size: 24px; }
            h1 { font-size: 22px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">Моя АнтиСоцсеть</div>
        <div class="icon">✅</div>
        <h1>Вы успешно вошли!</h1>
        <p>Аккаунт привязан. Теперь вы можете закрыть это окно и вернуться в Telegram-бот. Если окно не закрывается автоматически, нажмите кнопку ниже.</p>
        <button class="btn" onclick="window.close()">Закрыть окно</button>
        <div style="margin-top: 16px; font-size: 14px; color: var(--text-secondary);">
            <span id="countdown">Закроется через 10 секунд...</span>
        </div>
    </div>
    <div class="footer">
        <a href="https://news.proid.studio" target="_blank">news.proid.studio</a> &bull;
        <a href="https://news.proid.studio/privacy" target="_blank">Политика</a> &bull;
        <a href="https://news.proid.studio/offer" target="_blank">Оферта</a>
    </div>
    <script>
        let seconds = 10;
        const countdownEl = document.getElementById('countdown');
        const timer = setInterval(() => {
            seconds--;
            if (seconds <= 0) {
                clearInterval(timer);
                countdownEl.textContent = 'Закрываю...';
                setTimeout(() => { window.close(); }, 500);
            } else {
                countdownEl.textContent = 'Закроется через ' + seconds + ' секунд' + (seconds === 1 ? 'у' : 'ы') + '...';
            }
        }, 1000);
    </script>
</body>
</html>
